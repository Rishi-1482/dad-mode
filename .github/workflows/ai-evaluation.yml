name: AI Evaluation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: "300"
      DEEPEVAL_PER_TASK_TIMEOUT_SECONDS_OVERRIDE: "900"

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build knowledge base
        run: |
          python3 -m scripts.ingest

      - name: Run guardrail tests
        run: |
          python -m pytest tests/test_guardrails.py

      - name: Run DeepEval agent tests
        run: |
          deepeval test run evals/test_agent.py